<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="banner-title banner-desc">
  <title id="banner-title">senior-skills</title>
  <desc id="banner-desc">Stop prompting your AI like an intern. 15 skills that give coding agents a staff engineer's judgment. Works with Claude Code, Codex, Cursor, Gemini CLI, Copilot and OpenCode.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0F1F"/>
      <stop offset="1" stop-color="#131A38"/>
    </linearGradient>
    <linearGradient id="accent" gradientUnits="userSpaceOnUse" x1="300" y1="0" x2="660" y2="0">
      <stop offset="0" stop-color="#818CF8"/>
      <stop offset="0.55" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#34D399"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#818CF8"/>
      <stop offset="0.5" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#34D399"/>
    </linearGradient>
    <radialGradient id="glow-a" cx="0.12" cy="0.05" r="0.65">
      <stop offset="0" stop-color="#6366F1" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-b" cx="0.92" cy="1" r="0.55">
      <stop offset="0" stop-color="#10B981" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity="0.045"/>
    </pattern>
    <clipPath id="frame">
      <rect width="1280" height="400" rx="24"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1280" height="400" fill="url(#bg)"/>
    <rect width="1280" height="400" fill="url(#grid)"/>
    <rect width="1280" height="400" fill="url(#glow-a)"/>
    <rect width="1280" height="400" fill="url(#glow-b)"/>
    <rect x="0" y="0" width="1280" height="4" fill="url(#rule)"/>
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif">
    <text x="72" y="100" font-size="15" font-weight="700" letter-spacing="3.5" fill="#A5B4FC">AGENT SKILLS FOR CODING AGENTS</text>
    <text x="68" y="186" font-size="84" font-weight="800" letter-spacing="-2.5" fill="#F8FAFC">senior<tspan fill="url(#accent)">-skills</tspan></text>
    <text x="72" y="240" font-size="30" font-weight="650" fill="#E2E8F0">Stop prompting your AI like an intern.</text>
    <text x="72" y="278" font-size="20" fill="#94A3B8">15 skills that give coding agents a staff engineer’s judgment.</text>

    <g font-size="14" font-weight="600" fill="#CBD5E1" text-anchor="middle">
      <rect x="72" y="306" width="110" height="30" rx="15" fill="#1E293B" stroke="#334155"/>
      <text x="127" y="326">Claude Code</text>
      <rect x="192" y="306" width="70" height="30" rx="15" fill="#1E293B" stroke="#334155"/>
      <text x="227" y="326">Codex</text>
      <rect x="272" y="306" width="76" height="30" rx="15" fill="#1E293B" stroke="#334155"/>
      <text x="310" y="326">Cursor</text>
      <rect x="358" y="306" width="104" height="30" rx="15" fill="#1E293B" stroke="#334155"/>
      <text x="410" y="326">Gemini CLI</text>
      <rect x="472" y="306" width="82" height="30" rx="15" fill="#1E293B" stroke="#334155"/>
      <text x="513" y="326">Copilot</text>
      <rect x="564" y="306" width="94" height="30" rx="15" fill="#1E293B" stroke="#334155"/>
      <text x="611" y="326">OpenCode</text>
    </g>
  </g>

  <g>
    <rect x="748" y="52" width="468" height="296" rx="14" fill="#0B1222" fill-opacity="0.92" stroke="#334155"/>
    <path d="M748 66a14 14 0 0 1 14-14h440a14 14 0 0 1 14 14v22H748z" fill="#111A2E"/>
    <circle cx="772" cy="71" r="6" fill="#F87171"/>
    <circle cx="792" cy="71" r="6" fill="#FBBF24"/>
    <circle cx="812" cy="71" r="6" fill="#34D399"/>
    <text x="982" y="76" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#64748B">~/my-app</text>
    <line x1="748" y1="88" x2="1216" y2="88" stroke="#1E293B"/>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="15">
      <text x="772" y="122"><tspan fill="#818CF8">&gt;</tspan><tspan fill="#E2E8F0"> /plugin install senior-skills</tspan></text>
      <text x="772" y="154"><tspan fill="#34D399">✓</tspan><tspan fill="#CBD5E1"> senior-engineer</tspan></text>
      <text x="772" y="179"><tspan fill="#34D399">✓</tspan><tspan fill="#CBD5E1"> state-machine-hunter</tspan></text>
      <text x="772" y="204"><tspan fill="#34D399">✓</tspan><tspan fill="#CBD5E1"> prior-art-scout</tspan></text>
      <text x="772" y="229"><tspan fill="#34D399">✓</tspan><tspan fill="#CBD5E1"> bug-triage</tspan></text>
      <text x="772" y="254"><tspan fill="#34D399">✓</tspan><tspan fill="#CBD5E1"> finish-the-job</tspan></text>
      <text x="772" y="279"><tspan fill="#34D399">✓</tspan><tspan fill="#CBD5E1"> ci-auditor</tspan></text>
      <text x="772" y="304" fill="#64748B">+ 9 core craft skills</text>
      <text x="772" y="330"><tspan fill="#818CF8">&gt;</tspan><tspan fill="#E2E8F0"> Find the bugs that matter</tspan></text>
      <rect x="1018" y="317" width="9" height="17" fill="#22D3EE" fill-opacity="0.85"/>
    </g>
  </g>
</svg>
