name: Skill misbehaves
description: A skill didn't trigger, triggered when it shouldn't, or led the agent astray
labels: ["bug"]
body:
  - type: input
    id: skill
    attributes:
      label: Skill
      placeholder: e.g. bug-triage
    validations:
      required: true
  - type: input
    id: agent
    attributes:
      label: Agent and model
      placeholder: e.g. Claude Code 2.x, Codex CLI, Cursor; model name
    validations:
      required: true
  - type: textarea
    id: prompt
    attributes:
      label: What you asked
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
